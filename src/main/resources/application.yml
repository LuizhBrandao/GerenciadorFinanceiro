server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: gerenciador-financeiro
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

# Configurações padrão da API de Segurança / JWT
api:
  security:
    token:
      secret: ${JWT_SECRET:dev_super_secret_jwt_key_gerenciador_financeiro_2026}

# Configurações do OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Configurações de Webhooks e Pagamentos
webhook:
  stripe:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_secret_key_default}
    tolerance-seconds: 300

# Flag de controle de carga de dados demo
app:
  seed-demo-data: false
