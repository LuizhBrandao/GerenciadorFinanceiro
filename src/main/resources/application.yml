server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: gerenciador-financeiro
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/financeiro_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Configurações do OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Configurações de Webhooks e Pagamentos
webhook:
  stripe:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_secret_key_default}
    tolerance-seconds: 300
