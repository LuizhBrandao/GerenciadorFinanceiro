server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:financeiro_dev_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

# Swagger / Documentação ativa em Dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Habilita carga de sementes/dados demo no ambiente de desenvolvimento
app:
  seed-demo-data: true

# Logs detalhados em Dev
logging:
  level:
    br.com.gerenciadorfinanceiro: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
