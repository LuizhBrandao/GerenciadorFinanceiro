services:
  db:
    image: mysql:8.4
    container_name: financeiro_dev_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-financeiro_dev_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=-03:00
    volumes:
      - mysqldata_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_dev_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-financeiro_dev_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_jwt_key_gerenciador_financeiro_2026}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_mock_stripe_key_12345}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_network
    profiles:
      - full

volumes:
  mysqldata_dev:

networks:
  dev_network:
    driver: bridge
