services:
  db:
    image: mysql:8.4
    container_name: financeiro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me_123}
      MYSQL_DATABASE: financeiro_db
      MYSQL_USER: ${DB_USER:-financeiro_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-financeiro_change_me_123}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=-03:00
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiro_app
    restart: always
    ports:
      - "80:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/financeiro_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-financeiro_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-financeiro_change_me_123}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_secret_key_default}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysqldata:

networks:
  app-network:
    driver: bridge
